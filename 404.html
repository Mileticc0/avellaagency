<!DOCTYPE html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stranica nije pronađena | Avella Agency</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100svh;display:grid;place-items:center;background:#0A0A0A;color:#F2EEE8;font:300 17px/1.6 "Inter Tight",system-ui,sans-serif;text-align:center;padding:40px 20px}
a{color:#E8CFA0;text-decoration:none}a:hover{color:#C9A46A}
.g{background:linear-gradient(100deg,#E8CFA0,#C9A46A 50%,#8C6A3A);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:clamp(90px,18vw,200px);line-height:.9}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:clamp(30px,4vw,44px);margin:18px 0 10px}
h2 em{font-style:italic}
p{color:#8A8580;max-width:44ch;margin:0 auto}
.b{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:34px}
.btn{display:inline-flex;align-items:center;height:52px;padding:0 26px;border-radius:999px;border:1px solid rgba(201,164,106,.25);color:#F2EEE8;font-weight:500;font-size:15px}
.btn:hover{border-color:#C9A46A;color:#F2EEE8}
.gold{background:linear-gradient(100deg,#E8CFA0,#C9A46A 50%,#8C6A3A);color:#140f08;border-color:transparent}
.gold:hover{color:#140f08}
</style>
</head>
<body>
<main>
<h1 class="g">404</h1>
<h2>Ova stranica <em class="g">ne postoji</em></h2>
<p>Možda je link pogrešan ili je stranica premeštena. Pogledajte naše pakete ili nam pošaljite upit.</p>
<div class="b"><a class="btn gold" href="/#paketi">Pogledaj pakete</a><a class="btn" href="/kontakt.html">Zatraži ponudu</a><a class="btn" href="/">Početna</a></div>
</main>
</body>
</html>
